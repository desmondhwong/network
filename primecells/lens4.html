<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Orbital Lens — recursive (shell fixed)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --pad:10px;
      --ui-bg:rgba(255,255,255,0.88);
      --ui-border:#d0d0d0;
      --text:#111;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      background:#ffffff;               /* live-updated */
      overflow:hidden;                  /* lens stays centered to window edges */
    }

    /* Top controls overlay */
    #controls{
      position:fixed; z-index:20; left:var(--pad); right:var(--pad); top:var(--pad);
      background:var(--ui-bg); border:1px solid var(--ui-border); border-radius:8px;
      display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:8px 10px;
      min-height:48px;                  /* fixed bar height so text toggles don't shift size */
      backdrop-filter:saturate(1.2) blur(2px);
    }
    #controls.hidden{display:none}
    label{font-size:12px;color:#333;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
    input[type="number"]{width:7ch;text-align:center}
    input[type="color"]{width:28px;height:22px;padding:0;border:1px solid #bbb;border-radius:4px;background:#fff}
    button, input, select{font:inherit}
    button{padding:6px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
    button:active{transform:translateY(1px)}
    .flag{font-size:12px;padding:2px 6px;border-radius:4px;border:1px solid #aaa;background:#fff;margin-left:auto}

    /* Bottom info overlay */
    #footer{
      position:fixed; z-index:20; left:var(--pad); right:var(--pad); bottom:var(--pad);
      background:var(--ui-bg); border:1px solid var(--ui-border); border-radius:8px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:6px 10px; min-height:36px; font-size:12px; color:#333;
      backdrop-filter:saturate(1.2) blur(2px);
    }
    .kbd{background:#eee;border:1px solid #ddd;padding:1px 6px;border-radius:4px}

    /* The artboard: fixed, square, hard-centered to the window (not between UI bars) */
    #stage{
      position:fixed; z-index:0;
      top:50%; left:50%; transform:translate(-50%,-50%);
      width:min(86vmin,1100px);          /* generous margins at 100% */
      aspect-ratio:1/1;
    }
    svg{width:100%;height:100%;display:block;background:transparent;overflow:visible}
  </style>
</head>
<body>
  <!-- Controls overlay -->
  <div id="controls">
    <label>Prime p <input id="pInput" type="number" value="47" step="2" min="3"></label>
    <button id="prevPrime" title="Previous (← / [)">◀ Prev</button>
    <button id="nextPrime" title="Next (→ / ])">Next ▶</button>
    <button id="go47" title="Jump to 47">Go 47</button>
    <button id="resetP" title="Reset to 5">Reset to 5</button>

    <label>Zoom
      <button id="zoomOut" title="Zoom out (−)">−</button>
      <button id="zoomIn" title="Zoom in (+)">+</button>
      <button id="zoomReset" title="Reset (0)">Reset</button>
      <span id="zoomPct">100%</span>
    </label>

    <label>Background <input id="bgColor" type="color" value="#FFFFFF"></label>
    <label>Shell <input id="shellColor" type="color" value="#000000"></label>
    <label>Membrane A <input id="memAColor" type="color" value="#FFFFFF"></label>
    <label>Membrane B <input id="memBColor" type="color" value="#FFFFFF"></label>
    <label><input id="cutThrough" type="checkbox"> Cut-through</label>
    <label><input id="showMarkers" type="checkbox" checked> Show unit markers</label>

    <button id="downloadSvg" title="Download current SVG">Download SVG</button>
    <span id="belowFlag" class="flag" style="display:none">below-5 sequence</span>
  </div>

  <!-- Centered stage -->
  <div id="stage">
    <svg id="svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Orbital Lens">
      <defs id="defs"></defs>
      <!-- centered zoom root -->
      <g id="zoomRoot" transform="translate(500,500) scale(1) translate(-500,-500)">
        <g id="root"></g>
      </g>
    </svg>
  </div>

  <!-- Footer overlay -->
  <div id="footer">
    <div>Keys: <span class="kbd">[</span>/<span class="kbd">]</span> or <span class="kbd">←</span>/<span class="kbd">→</span> primes; <span class="kbd">-</span>/<span class="kbd">=</span> zoom; <span class="kbd">0</span> reset; <span class="kbd">c</span> controls.</div>
    <div id="info"></div>
  </div>

  <script>
    // ---------- Prime helpers ----------
    function isPrime(n){
      if(n<2||n%1) return false;
      if(n%2===0) return n===2;
      for(let i=3;i*i<=n;i+=2){ if(n%i===0) return false; }
      return true;
    }
    function nextPrime(n){ let k=Math.max(2,Math.floor(n)+1); if(k%2===0) k++; while(!isPrime(k)) k+=2; return k; }
    function prevPrime(n){ let k=Math.max(2,Math.floor(n)-1); if(k%2===0) k--; while(k>=2 && !isPrime(k)) k-=2; return k<2?2:k; }
    // below-5 family: p ≡ 2 (mod 3): 11,17,23,…
    function nextP_mod3eq2(n){ let k=Math.max(11,n+1); while(!isPrime(k)||k%3!==2) k++; return k; }
    function prevP_mod3eq2(n){ let k=Math.max(11,n-1); while(k>=11 && (!isPrime(k)||k%3!==2)) k--; return k<11?11:k; }

    // ---------- DOM ----------
    const SVG  = document.getElementById('svg');
    const DEFS = document.getElementById('defs');
    const ZROOT= document.getElementById('zoomRoot');
    const ROOT = document.getElementById('root');
    const CONTROLS = document.getElementById('controls');

    const UI = {
      p: document.getElementById('pInput'),
      prev: document.getElementById('prevPrime'),
      next: document.getElementById('nextPrime'),
      go47: document.getElementById('go47'),
      resetP: document.getElementById('resetP'),
      zoomIn: document.getElementById('zoomIn'),
      zoomOut: document.getElementById('zoomOut'),
      zoomReset: document.getElementById('zoomReset'),
      zoomPct: document.getElementById('zoomPct'),
      bg: document.getElementById('bgColor'),
      shell: document.getElementById('shellColor'),
      memA: document.getElementById('memAColor'),
      memB: document.getElementById('memBColor'),
      cut: document.getElementById('cutThrough'),
      markers: document.getElementById('showMarkers'),
      dl: document.getElementById('downloadSvg'),
      belowFlag: document.getElementById('belowFlag'),
      info: document.getElementById('info'),
    };

    // ---------- State ----------
    let p = 47;
    let below5 = false;
    let zoom = 1;                    // centered g-scale
    const cx=500, cy=500;
    const R0 = 480;                  // shell radius (fixed in recursive mode)

    // ---------- Zoom ----------
    function applyZoom(){
      ZROOT.setAttribute('transform', `translate(${cx},${cy}) scale(${zoom}) translate(${-cx},${-cy})`);
      UI.zoomPct.textContent = `${Math.round(zoom*100)}%`;
    }
    function zoomBy(f){ zoom*=f; if(zoom<0.2) zoom=0.2; if(zoom>12) zoom=12; applyZoom(); }
    function zoomReset(){ zoom=1; applyZoom(); }
    UI.zoomIn.onclick = ()=>zoomBy(1.1);
    UI.zoomOut.onclick = ()=>zoomBy(1/1.1);
    UI.zoomReset.onclick = zoomReset;
    window.addEventListener('keydown', (e)=>{
      if(e.key==='='||e.key==='+') zoomBy(1.1);
      if(e.key==='-') zoomBy(1/1.1);
      if(e.key==='0') zoomReset();
      if(e.key==='c' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ // toggle controls
        CONTROLS.classList.toggle('hidden');
      }
    });

    // ---------- Geometry ----------
    function circle(x,y,r,fill){ const c=document.createElementNS(SVG.namespaceURI,'circle'); c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',r); if(fill) c.setAttribute('fill',fill); return c; }
    function rect(x,y,w,h,fill){ const r=document.createElementNS(SVG.namespaceURI,'rect'); r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',w); r.setAttribute('height',h); if(fill) r.setAttribute('fill',fill); return r; }
    function unitY(i,u){ return cy - R0 + (i+0.5)*u; }

    // black/white membership
    function isBlackUnit(i, prime, isBelow){
      if(!isBelow){
        const m = (prime-3)/2;
        return (i===0) || (i===m+1) || (i===prime-1);
      } else {
        const k = (prime-2)/3;
        if(i <  k) return true;
        if(i === k) return false;
        if(i <  2*k+1) return true;
        if(i === 2*k+1) return false;
        return i <  3*k+2;
      }
    }

    function membraneGeometry(prime, isBelow){
      const u  = (2*R0)/prime;
      let rm, yTop, yBot;
      if(!isBelow){
        const m = (prime-3)/2;
        rm = (m*u)/2;
        yTop = cy - R0 + u + rm;
        yBot = cy + R0 - u - rm;
      } else {
        const k = (prime-2)/3;
        rm = u/2;
        yTop = cy - R0 + k*u + rm;
        yBot = cy + R0 - k*u - rm;
      }
      return {u,rm,yTop,yBot};
    }

    // ---------- Draw ----------
    function draw(){
      document.body.style.background = UI.bg.value;
      while(ROOT.firstChild) ROOT.removeChild(ROOT.firstChild);

      const {u,rm,yTop,yBot} = membraneGeometry(p, below5);

      // optional mask for cut-through
      let maskId = null;
      if(UI.cut.checked){
        maskId = 'mask-orbital';
        const old = document.getElementById(maskId); if(old) old.remove();
        const mEl = document.createElementNS(SVG.namespaceURI,'mask'); mEl.id=maskId;
        mEl.appendChild(rect(0,0,1000,1000,'white'));
        mEl.appendChild(circle(cx,yTop,rm,'black'));
        mEl.appendChild(circle(cx,yBot,rm,'black'));
        DEFS.appendChild(mEl);
      }

      // Shell
      const shell = circle(cx,cy,R0,UI.shell.value);
      if(maskId) shell.setAttribute('mask',`url(#${maskId})`);
      ROOT.appendChild(shell);

      // Membranes
      if(!maskId){
        ROOT.appendChild(circle(cx,yTop,rm,UI.memA.value));
        ROOT.appendChild(circle(cx,yBot,rm,UI.memB.value));
      }

      // Unit markers — show all black units (above-5: top/nucleus/bottom; below-5: three k-blocks)
      if(UI.markers.checked){
        const ru = u/2;
        for(let i=0;i<p;i++){
          if(isBlackUnit(i,p,below5)){
            ROOT.appendChild(circle(cx, unitY(i,u), ru, '#000'));
          }
        }
      }

      // Info
      const m_above = (p-3)/2;
      const k_below = (p-2)/3;
      const dec = below5 ? `${k_below}+1+${k_below}+1+${k_below}` : `1+${m_above}+1+${m_above}+1`;
      UI.info.textContent = `p=${p} | ${below5?'below-5':'above-5'} | decomposition: ${dec} | unit=${((2*R0)/p).toFixed(2)} | zoom ${Math.round(zoom*100)}%`;
      UI.belowFlag.style.display = below5 ? 'inline-block' : 'none';
    }

    // ---------- Navigation ----------
    function coerceInputToState(raw){
      let val = Number(raw);
      if(!Number.isFinite(val)) val = 5;
      if(val < 5){ below5 = true; val = 11; }
      else { below5 = false; if(!isPrime(val)) val = nextPrime(val-1); if(val<5) val=5; }
      return val;
    }
    function stepPrev(){
      if(!below5){
        if(p>5){ p = prevPrime(p); if(p<5) p=5; }
        else { below5=true; p=11; }
      } else { p = nextP_mod3eq2(p); }
      UI.p.value = p; draw();
    }
    function stepNext(){
      if(!below5){ p = nextPrime(p); }
      else { if(p===11){ below5=false; p=5; } else { p = prevP_mod3eq2(p); } }
      UI.p.value = p; draw();
    }

    // ---------- Events ----------
    UI.prev.onclick = stepPrev;
    UI.next.onclick = stepNext;
    UI.go47.onclick = ()=>{ below5=false; p=47; UI.p.value=47; draw(); };
    UI.resetP.onclick = ()=>{ below5=false; p=5; UI.p.value=5; draw(); };
    UI.p.addEventListener('change', ()=>{ const v=coerceInputToState(UI.p.value); p=v; UI.p.value=v; draw(); });
    [UI.bg, UI.shell, UI.memA, UI.memB, UI.cut, UI.markers].forEach(el=>el.addEventListener('input', draw));
    window.addEventListener('keydown', (e)=>{
      if(e.key===']' || e.key==='ArrowRight'){ e.preventDefault(); stepNext(); }
      if(e.key==='[' || e.key==='ArrowLeft'){ e.preventDefault(); stepPrev(); }
    });

    // Download
    UI.dl.addEventListener('click', ()=>{
      const clone = SVG.cloneNode(true);
      // embed page background for cut-through export
      const bg = document.createElementNS(SVG.namespaceURI,'rect');
      bg.setAttribute('x',0); bg.setAttribute('y',0); bg.setAttribute('width',1000); bg.setAttribute('height',1000);
      bg.setAttribute('fill', getComputedStyle(document.body).backgroundColor);
      clone.insertBefore(bg, clone.firstChild);
      const s = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([s], {type:'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download=`orbital-lens-p${p}${below5?'-below':''}.svg`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // ---------- Init ----------
    function init(){
      p = 47; below5=false; UI.p.value=p;
      zoomReset();  // centered, 100%
      draw();
    }
    init();
  </script>
</body>
</html>
